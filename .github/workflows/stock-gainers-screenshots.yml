name: Stock Gainers Screenshots to Google Doc

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of stocks to capture
        required: false
        default: "50"
      doc_title_prefix:
        description: Prefix for generated Google Doc title
        required: false
        default: "Google Finance Gainers"
  schedule:
    - cron: "0 14 * * 1-5"

jobs:
  capture-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
      DOC_TITLE_PREFIX: ${{ github.event.inputs.doc_title_prefix || 'Google Finance Gainers' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run capture workflow
        run: |
          python scripts/capture_gainers_to_gdoc.py \
            --limit "${{ github.event.inputs.limit || '50' }}" \
            --doc-title-prefix "${DOC_TITLE_PREFIX}" \
            --output-dir "artifacts/screenshots"

      - name: Upload screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stock-gainer-screenshots
          path: artifacts/screenshots
