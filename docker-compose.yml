services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: renthuman
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/renthuman
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
    volumes: ["./backend/uploads:/app/uploads"]
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports: ["3001:3000"]
    depends_on: [backend]
volumes:
  pgdata:
