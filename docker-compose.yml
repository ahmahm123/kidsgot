version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: video-feed-postgres
    environment:
      POSTGRES_DB: video_feed
      POSTGRES_USER: video_feed
      POSTGRES_PASSWORD: video_feed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: video-feed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
